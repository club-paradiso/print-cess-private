name: One-time formatting repair for PR 171
on:
  push:
    branches:
      - dependabot/npm_and_yarn/development-dependencies-9cb24f391d
    paths:
      - .github/workflows/pr171-format-once.yml
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'club-paradiso/print-cess-private'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dependabot/npm_and_yarn/development-dependencies-9cb24f391d
          persist-credentials: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - name: Correct Prettier format under updated dependency and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write             apps/web/src/components/mobile/print-batch-copy.ts             apps/web/src/lib/first-sentence.test.ts             docs/ACCESSIBILITY_LANGUAGE_ACCEPTANCE.md             packages/i18n/src/index.ts
          pnpm format:check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/pr171-format-once.yml
          git add -A
          git diff --cached --stat
          git commit -m "fix: format files for Prettier 3.10.1"
          git push origin HEAD:dependabot/npm_and_yarn/development-dependencies-9cb24f391d
