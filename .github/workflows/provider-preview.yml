name: Preview provider acceptance

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Approved Preview provider suite
        required: true
        default: all
        type: choice
        options:
          - all
          - redis
          - blob
          - qstash

permissions:
  contents: read

concurrency:
  group: preview-provider-acceptance
  cancel-in-progress: false

jobs:
  provider-acceptance:
    name: Approved Preview providers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: vercel-preview
    env:
      RUN_PROVIDER_INTEGRATION: "true"
      PROVIDER_ENVIRONMENT: preview
      PROVIDER_CONFIRM_SYNTHETIC_ONLY: "true"
      PROVIDER_TEST_SUITE: ${{ inputs.suite }}
      PROVIDER_BASE_URL: ${{ vars.PROVIDER_BASE_URL }}
      UPSTASH_DISABLE_TELEMETRY: "1"
      WORKFLOW_REF: ${{ github.ref }}
    steps:
      - name: Require protected main workflow ref
        run: test "$WORKFLOW_REF" = "refs/heads/main"

      - name: Check out protected main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Secrets reach only this step, not the setup actions or the install.
      - name: Run synthetic provider acceptance
        env:
          BLOB_STORE_ID: ${{ secrets.BLOB_STORE_ID }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.QSTASH_CURRENT_SIGNING_KEY }}
          QSTASH_NEXT_SIGNING_KEY: ${{ secrets.QSTASH_NEXT_SIGNING_KEY }}
        run: pnpm test:provider
