name: One-time Prettier repair for PR 171

on:
  push:
    branches:
      - dependabot/npm_and_yarn/development-dependencies-9cb24f391d
    paths:
      - .github/workflows/.repair-format-pr171.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: dependabot/npm_and_yarn/development-dependencies-9cb24f391d
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Format the four failing files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/mobile/print-batch-copy.ts \
            apps/web/src/lib/first-sentence.test.ts \
            docs/ACCESSIBILITY_LANGUAGE_ACCEPTANCE.md \
            packages/i18n/src/index.ts
          pnpm exec prettier --check \
            apps/web/src/components/mobile/print-batch-copy.ts \
            apps/web/src/lib/first-sentence.test.ts \
            docs/ACCESSIBILITY_LANGUAGE_ACCEPTANCE.md \
            packages/i18n/src/index.ts

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/.repair-format-pr171.yml
          git add -- \
            .github/workflows/.repair-format-pr171.yml \
            apps/web/src/components/mobile/print-batch-copy.ts \
            apps/web/src/lib/first-sentence.test.ts \
            docs/ACCESSIBILITY_LANGUAGE_ACCEPTANCE.md \
            packages/i18n/src/index.ts
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "fix: format existing files for Prettier 3.10.1"
          git push origin HEAD:dependabot/npm_and_yarn/development-dependencies-9cb24f391d
